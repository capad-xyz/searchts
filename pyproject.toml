[project]
name = "searchts"
version = "0.24.2"
description = "The missing layer between AI and the web. Open-source escalating unlocker (browser-fingerprinted fetch -> JS-render relay -> stealth browser) for `read`, keyless multi-provider `search` with rank fusion, subtitles-first video `transcribe`, and on-demand asset/design-inspiration `grab` (palette/fonts/assets through the same unlocker). CLI + MCP server + Claude Code skill. Keyless by default; optional platform helpers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "capad", email = "oss@capad.fyi"}]
keywords = [
    "ai-agent", "llm-tools", "agent-infrastructure", "mcp",
    "web-reader", "web-unlocker", "unlocker", "anti-bot",
    "web-search", "ai-search", "rank-fusion",
    "video-transcription", "whisper",
    "assets", "design-inspiration", "web-scraper",
    "cli", "claude-code",
    "free", "no-api-key", "keyless",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.28",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "rich>=13.0",
    # #442: the JS runtime YouTube needs comes in as a Python package (deno via
    # yt-dlp's own extra), so no apt/NodeSource Node.js and no edit to the
    # user's yt-dlp config. yt-dlp finds it in this env's scripts directory.
    "yt-dlp[default,deno]>=2026.10.21",
    "curl_cffi>=0.7",
    "trafilatura>=1.8",
    "ddgs>=9.0",
    # #442: first-pass setup. These used to be extras a plain install missed.
    # The stealth browser is core to reads now (Chromium itself is on the one
    # up-front consent list, `searchts install`).
    "patchright>=1.50",
    "browser-cookie3>=0.19",
    # P2.3: SDK 2.x renamed FastMCP -> MCPServer. Cap below 3.
    "mcp[cli]>=2,<3",
    # A bundled ffmpeg binary (no ffprobe; nothing searchts runs needs it).
    # Used when ffmpeg is not on PATH, so transcription needs no system install.
    "imageio-ffmpeg>=0.5",
    # #439: keyless local transcription runs on whisper.cpp. PyPI ships CPU
    # wheels for CPython 3.10-3.14 on Windows x64, macOS arm64, and Linux
    # x64/arm64. Windows arm64/macOS x64 may build from source. GPU wheels are
    # not published; Metal/Vulkan wheels are a separately approved follow-up.
    "pywhispercpp>=1.5,<2",
    # Login reuse across subdomains needs the real Public Suffix List, not an
    # approximation: co.uk and github.io must never become one shared site.
    # Pure Python, no dependencies, ships the list (about 109 KB).
    "publicsuffixlist>=1.1",
]

[project.optional-dependencies]
# #442: browser, cookies and mcp are in the base install now. The extras stay
# as empty aliases so existing specs (searchts[mcp,browser], the uvx and
# `claude mcp add` lines) keep resolving.
browser = []
cookies = []
mcp = []
# #439: whisper.cpp (pywhispercpp) is the local engine, in the base install.
# faster-whisper stays installable as the fallback during the migration window
# (30 days and 2 releases after the release that ships this), then goes.
local-transcribe = ["faster-whisper>=1.0"]  # fallback local engine (searchts transcribe --provider local-fw)
all = ["faster-whisper>=1.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.12",
    "types-requests>=2.32",
    "types-PyYAML>=6.0",
]

[project.scripts]
searchts = "searchts.cli:main"

[project.urls]
# Homepage points at the write-up rather than back at this repo, which the
# Repository link already covers. It also closes the loop the other way: the
# case study names the author, so the package, the site and the person resolve
# to one another instead of three unconnected pages.
Homepage = "https://capad.fyi/work/searchts"
Repository = "https://github.com/capad-xyz/searchts"
Issues = "https://github.com/capad-xyz/searchts/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["searchts"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
# W292 (no newline at end of file) is enforced from 33bb516. Only that one
# rule is added: enabling all of W also turns up W293 in cookie_extract.py,
# which is not this branch's business. The six files below already ended
# mid-line before this branch and are left alone rather than folded into an
# unrelated change; they are tracked, not endorsed.
per-file-ignores = { "searchts/paging.py" = ["W292"], "tests/test_caps.py" = ["W292"], "tests/test_dogfood.py" = ["W292"], "tests/test_hare_hb3.py" = ["W292"], "tests/test_mcp_next_url.py" = ["W292"], "tests/test_paging.py" = ["W292"] }
extend-select = ["W292"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/", "^.venv/"]
