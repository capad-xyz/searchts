name: f22-review-assemble
on:
  push:
    branches: [feat/install-browser-f22]
    paths:
      - ".github/workflows/f22-review-assemble.yml"
      - ".github/f22-review/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/install-browser-f22
          fetch-depth: 0
      - name: Assemble reviewed files and commit
        run: |
          set -euo pipefail
          mkdir -p searchts tests docs
          cat .github/f22-review/browser_install.part1 .github/f22-review/browser_install.part2 > searchts/browser_install.py
          cat .github/f22-review/test_browser_install.part1 .github/f22-review/test_browser_install.part2 > tests/test_browser_install.py
          cp .github/f22-review/install.md docs/install.md
          cp .github/f22-review/README.md README.md
          rm -rf .github/f22-review .github/workflows/f22-review-assemble.yml
          git config user.name "capad-xyz"
          git config user.email "163459540+capad-xyz@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo No changes; exit 0; fi
          git commit -m "$(cat <<'EOF'
          fix(cli): Claude review for install --browser (uvx/uv tool/pipx)

          Chromium is per-user cache: uvx with patchright only installs Chromium;
          missing patchright hints uvx --from searchts[browser]@latest.
          Detect ephemeral uvx via archive-v0 only (not UV_PYTHON).
          uv tool prints force reinstall instead of uv pip inject.
          Stream Chromium to stderr. pipx by pipx/venvs prefix; inject metadata reqs.

          Co-authored-by: Tess <composer-2-fast>
          Effort: high
          EOF
          )"
          git push origin HEAD:feat/install-browser-f22
