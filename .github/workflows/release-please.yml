name: release-please

# Keeps a standing release PR up to date: computes the next version from the
# conventional-commit history, rewrites the four version sites and CHANGELOG.md.
# Merging that PR tags the release, and release.yml publishes from the tag.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Never cancel: a half-finished release PR update is worse than a slow one.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Require RELEASE_PLEASE_TOKEN
        env:
          HAS_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set."
            echo "::error::A tag pushed with GITHUB_TOKEN cannot trigger release.yml, so nothing would reach PyPI."
            echo "::error::Add a fine-grained PAT (contents + pull-requests write) as the RELEASE_PLEASE_TOKEN secret."
            exit 1
          fi

      - name: Maintain the release PR, and tag when it merges
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Report outcome
        env:
          CREATED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$CREATED" != "true" ]; then
            echo "No release cut. The standing release PR is up to date."
            exit 0
          fi
          echo "Tagged $TAG with RELEASE_PLEASE_TOKEN, so release.yml will build and publish to PyPI."
