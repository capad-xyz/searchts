name: hare

# R1c doorbell. Not a required check. Secrets exist only on same-repo PRs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: hare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

jobs:
  r1:
    name: r1
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Always green: a dead brain posts searchts-r1-needed instead of failing CI.
    continue-on-error: true
    steps:
      # Runner script from main once this file exists there. This PR bootstraps
      # from HEAD only if the file is missing on base (chicken-egg).
      - name: Checkout trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Bootstrap hare script from PR if not on base
        if: hashFiles('scripts/hare_r1.py') == ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: scripts/hare_r1.py
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hare R1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SEARCHTS_HARE_API_KEY_NOUS: ${{ secrets.SEARCHTS_HARE_API_KEY_NOUS }}
          SEARCHTS_HARE_API_KEY_OR: ${{ secrets.SEARCHTS_HARE_API_KEY_OR }}
          HARE_NOUS_MODEL: poolside/laguna-s-2.1
          HARE_OR_MODEL: poolside/laguna-s-2.1:free
        run: python scripts/hare_r1.py
