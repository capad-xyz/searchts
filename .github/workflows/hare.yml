name: hare

# R1c doorbell + R1b identity. Not a required check. Secrets exist only on same-repo PRs.
# /hare on a PR comment (humans only) retries. workflow_dispatch retries with an optional model.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string
      or_model:
        description: Optional OpenRouter model slug for this run
        required: false
        type: string

concurrency:
  # Include event_name. CodeRabbit's skip-comment is issue_comment; without this
  # it queues a skipped run in the same group and cancels the real pull_request review.
  group: hare-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read
  issues: read

jobs:
  r1:
    name: r1
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/hare') &&
       github.event.comment.user.login != 'searchts-hare[bot]' &&
       github.event.comment.user.login != 'github-actions[bot]') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Always green: a dead brain posts searchts-r1-needed instead of failing CI.
    continue-on-error: true
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Bootstrap hare script from PR if not on base
        if: hashFiles('scripts/hare_r1.py') == ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/hare_r1.py
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # R1b: comments as searchts-hare[bot]. Mint fails (bad PEM / not installed) → GITHUB_TOKEN.
      - name: Mint searchts-hare[bot] token
        id: hare-app
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.HARE_APP_ID }}
          private-key: ${{ secrets.HARE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: searchts

      - name: Hare R1
        env:
          GITHUB_TOKEN: ${{ steps.hare-app.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SEARCHTS_HARE_API_KEY_NOUS: ${{ secrets.SEARCHTS_HARE_API_KEY_NOUS }}
          SEARCHTS_HARE_API_KEY_OR: ${{ secrets.SEARCHTS_HARE_API_KEY_OR }}
          SEARCHTS_HARE_API_KEY_ZEN: ${{ secrets.SEARCHTS_HARE_API_KEY_ZEN }}
          HARE_NOUS_MODEL: poolside/laguna-s-2.1,stepfun/step-3.7-flash
          HARE_OR_MODEL: ${{ github.event.inputs.or_model || 'poolside/laguna-s-2.1:free,qwen/qwen3.8-27b:free,nex-agi/nex-n2.5-pro:free' }}
          HARE_ZEN_MODEL: ling-3.0-flash-fin-free
        run: python scripts/hare_r1.py
