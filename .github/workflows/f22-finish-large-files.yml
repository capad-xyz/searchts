name: f22-finish-large-files
# One-shot: apply small patches that MCP could not upload as full files.
# Self-disables after a successful apply commit.
on:
  push:
    branches: [feat/install-browser-f22]
    paths:
      - ".github/workflows/f22-finish-large-files.yml"
      - ".github/patches/f22-cli.patch"
      - ".github/patches/f22-unlocker.patch"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/install-browser-f22
          fetch-depth: 0

      - name: Apply F22 patches and clean probes
        run: |
          set -euo pipefail
          if grep -q "searchts install --browser" searchts/cli.py && \
             grep -q 'searchts install --browser' searchts/unlocker.py && \
             ! test -e searchts/_f22_probe.txt && ! test -e searchts/_f22_probe2.txt; then
            echo "Already applied; nothing to do."
            exit 0
          fi
          if ! grep -q "searchts install --browser" searchts/cli.py; then
            patch -p1 < .github/patches/f22-cli.patch
          fi
          if grep -q "pip install patchright && patchright install chromium" searchts/unlocker.py; then
            patch -p1 < .github/patches/f22-unlocker.patch
          fi
          rm -f searchts/_f22_probe.txt searchts/_f22_probe2.txt
          # Remove this one-shot workflow + patches after apply so we do not loop.
          rm -f .github/workflows/f22-finish-large-files.yml
          rm -f .github/patches/f22-cli.patch .github/patches/f22-unlocker.patch
          rmdir .github/patches 2>/dev/null || true
          git config user.name "capad-xyz"
          git config user.email "163459540+capad-xyz@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          feat(cli): wire install --browser in cli and unlocker

          Apply remaining F22 keep-path wiring (CLI flag + hint strings) and drop probe junk.

          Co-authored-by: Tess <composer-2-fast>
          Effort: high
          EOF
          )"
          git push origin HEAD:feat/install-browser-f22
