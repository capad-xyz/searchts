# Hare's eval (PLAN R1c): old PRs with confirmed issues, run through each
# provider with thinking off and on, scored against docs/hare-eval-cases.json.
# Posts nothing on any PR. Runs only by hand, opens one PR with the report.
name: hare-eval

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Case ids, comma separated (empty runs all)"
        required: false
        default: ""
      providers:
        description: "Providers, comma separated"
        required: false
        default: "openrouter,nous,groq,gemini"
      graphs:
        description: "Codebase graph: on, off, or off,on to measure what it adds"
        required: false
        default: "on"
      modes:
        description: "Thinking modes: off, on, or off,on"
        required: false
        default: "off,on"
      repeat:
        description: "Runs per cell"
        required: false
        default: "1"
      cases_file:
        description: "Answer key to score against (empty uses docs/hare-eval-cases.json)"
        required: false
        default: ""
      raw_dir:
        description: "Write every answer and error here (empty writes none)"
        required: false
        default: ""
      budget:
        description: "Reasoning token budget per call (empty keeps the production default)"
        required: false
        default: ""
      models:
        description: "provider:slug pairs to use instead of each provider's first pin"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hare-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # each case's graph reads a worktree at that case's own base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the eval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The eval prefers its own keys (HARE_EVAL_KEY_*), so a long run does not
          # spend the free quota live reviews need (#287's /hare deep was rate
          # limited during the 2026-10-05 run). Free quotas are per account, so the
          # eval's keys help only from separate accounts. Unset: the shared keys.
          SEARCHTS_HARE_API_KEY_GROQ: ${{ secrets.HARE_EVAL_KEY_GROQ || secrets.SEARCHTS_HARE_API_KEY_GROQ }}
          SEARCHTS_HARE_API_KEY_GEMINI: ${{ secrets.HARE_EVAL_KEY_GEMINI || secrets.SEARCHTS_HARE_API_KEY_GEMINI }}
          SEARCHTS_HARE_API_KEY_NOUS: ${{ secrets.HARE_EVAL_KEY_NOUS || secrets.SEARCHTS_HARE_API_KEY_NOUS }}
          SEARCHTS_HARE_API_KEY_OR: ${{ secrets.HARE_EVAL_KEY_OR || secrets.SEARCHTS_HARE_API_KEY_OR }}
          CASES: ${{ inputs.cases }}
          PROVIDERS: ${{ inputs.providers }}
          MODES: ${{ inputs.modes }}
          GRAPHS: ${{ inputs.graphs }}
          REPEAT: ${{ inputs.repeat }}
          CASES_FILE: ${{ inputs.cases_file }}
          RAW_DIR: ${{ inputs.raw_dir }}
          BUDGET: ${{ inputs.budget }}
          MODELS: ${{ inputs.models }}
        run: |
          # An answer key and a raw directory are optional: the eval has always
          # run against docs/hare-eval-cases.json without saving anything, and a
          # proof run needs both. The flags are omitted rather than passed empty
          # so the defaults stay the defaults.
          args=(--only "$CASES" --providers "$PROVIDERS" --modes "$MODES" --graphs "$GRAPHS" --repeat "$REPEAT" --out docs)
          if [ -n "$CASES_FILE" ]; then args+=(--cases "$CASES_FILE"); fi
          if [ -n "$RAW_DIR" ]; then args+=(--raw-dir "$RAW_DIR"); fi
          if [ -n "$BUDGET" ]; then args+=(--budget "$BUDGET"); fi
          if [ -n "$MODELS" ]; then
            while IFS= read -r m; do [ -n "$m" ] && args+=(--model "$m"); done < <(printf '%s' "$MODELS" | tr ',' '\n')
          fi
          python scripts/hare_eval.py "${args[@]}"
          if [ -n "$RAW_DIR" ]; then
            # The raw answers are the evidence. Upload them so a reader can
            # check a row without re-running, and commit them when asked.
            tar czf "/tmp/raw-outputs.tgz" "$RAW_DIR"
            echo "raw outputs: $(find "$RAW_DIR" -name '*.json' | wc -l) files"
          fi
          day="$(date -u +%Y-%m-%d)"
          cp "docs/hare-eval-$day.md" "/tmp/hare-eval-$day.md"
          cp "docs/hare-eval-$day.json" "/tmp/hare-eval-$day.json"
      - name: Upload the raw answers
        if: always() && inputs.raw_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: hare-eval-raw-${{ github.run_id }}
          path: ${{ inputs.raw_dir }}
          retention-days: 90
      - name: Open a PR with the report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_DIR: ${{ inputs.raw_dir }}
        run: |
          day="$(date -u +%Y-%m-%d)"
          branch="chore/hare-eval-$day-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Branch from current main and add only the report. GITHUB_TOKEN
          # cannot push a branch whose workflow file differs from the default
          # branch. workflows: write is a real permissions key; this job does
          # not set it, because the report branch must not change the workflow.
          # checkout -f is deliberate: the job reuses the workspace, so a dirty
          # tree is reset. Do not copy that flag into a workflow that has work to keep.
          git fetch origin main
          git checkout -f -B "$branch" origin/main
          cp "/tmp/hare-eval-$day.md" "docs/hare-eval-$day.md"
          cp "/tmp/hare-eval-$day.json" "docs/hare-eval-$day.json"
          if [ -n "$RAW_DIR" ] && [ -f "/tmp/raw-outputs.tgz" ]; then
            mkdir -p "$(dirname "$RAW_DIR")"
            tar xzf "/tmp/raw-outputs.tgz"
          fi
          git add -A "docs/hare-eval-$day.md" "docs/hare-eval-$day.json" ${RAW_DIR:+"$RAW_DIR"}
          git commit -m "chore(hare): eval $day"
          git push -f origin "$branch"
          summary="$(awk '/^\| Provider/{p=1} /^## Per expected issue/{p=0} p' "docs/hare-eval-$day.md")"
          body="$(printf '## What\n\n**Automated run** of `.github/workflows/hare-eval.yml` (run %s), dispatched by hand. `scripts/hare_eval.py` replayed old PRs with confirmed issues through each provider with thinking off and on and scored the findings against `docs/hare-eval-cases.json`. Nothing was posted on any PR.\n\n%s\n\n## Models\n\n| Role | Model | Effort | Purpose |\n| --- | --- | --- | --- |\n| ran | the first model of each provider, as listed in the report | off and on | reviewed the old PRs for the eval; scoring is deterministic, by scripts/hare_eval.py |\n' "${{ github.run_id }}" "$summary")"
          gh pr create --base main --head "$branch" --title "chore(hare): eval $day" --body "$body"
